<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار أسلوب الاستفهام | الصف السادس</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#fff;
  --ink:#172033;
  --muted:#697386;
  --primary:#1769aa;
  --primary2:#0f4f82;
  --ok:#16834b;
  --bad:#c53b3b;
  --line:#e4e9f0;
  --shadow:0 10px 30px rgba(20,45,80,.09)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:linear-gradient(180deg,#eef6ff 0,#f7f9fc 320px);
  color:var(--ink);
  font-family:"Noto Naskh Arabic","Tahoma","Arial",sans-serif
}

header{
  background:linear-gradient(135deg,#0d5d91,#1683b9);
  color:#fff;
  padding:28px 18px 24px;
  box-shadow:0 4px 18px #174c6b2b
}

.wrap{
  max-width:900px;
  margin:auto
}

h1{
  margin:0 0 7px;
  font-size:clamp(25px,5vw,38px)
}

.subtitle{
  margin:0;
  opacity:.9;
  font-size:16px
}

.topbar{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-top:20px;
  flex-wrap:wrap
}

.badge{
  background:#ffffff1f;
  border:1px solid #ffffff40;
  padding:7px 12px;
  border-radius:999px
}

.progress{
  height:9px;
  background:#ffffff35;
  border-radius:20px;
  overflow:hidden;
  flex:1;
  min-width:180px
}

.progress>span{
  display:block;
  height:100%;
  width:0;
  background:#fff;
  border-radius:20px;
  transition:.25s
}

main{
  padding:22px 14px 50px
}

.ad{
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:4px auto 18px;
  overflow:hidden
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px
}

.qno{
  color:var(--primary);
  font-weight:800;
  font-size:14px;
  margin-bottom:9px
}

.question{
  font-size:22px;
  line-height:1.8;
  font-weight:800;
  margin-bottom:18px
}

.options{
  display:grid;
  gap:11px
}

.option{
  border:2px solid var(--line);
  background:#fbfcfe;
  border-radius:14px;
  padding:14px 15px;
  text-align:right;
  cursor:pointer;
  font-size:17px;
  line-height:1.65;
  transition:.15s
}

.option:hover{
  border-color:#8eb9d9;
  background:#f4faff
}

.option.selected{
  border-color:var(--primary);
  background:#eaf5fd
}

.option.correct{
  border-color:var(--ok);
  background:#edf9f2
}

.option.wrong{
  border-color:var(--bad);
  background:#fff0f0
}

.option input{
  display:none
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px
}

button{
  border:0;
  border-radius:13px;
  padding:12px 20px;
  font:inherit;
  font-weight:800;
  cursor:pointer
}

.next{
  background:var(--primary);
  color:#fff
}

.next:disabled{
  opacity:.45;
  cursor:not-allowed
}

.prev{
  background:#edf1f5;
  color:#263447
}

.result{
  display:none
}

.score{
  font-size:48px;
  font-weight:900;
  color:var(--primary);
  text-align:center
}

.result h2{
  text-align:center;
  margin-top:0
}

.small{
  color:var(--muted);
  font-size:14px
}

.review{
  border-top:1px solid var(--line);
  margin-top:18px;
  padding-top:16px
}

.reviewItem{
  padding:14px 0;
  border-bottom:1px solid var(--line);
  line-height:1.8
}

.oktxt{
  color:var(--ok);
  font-weight:800
}

.badtxt{
  color:var(--bad);
  font-weight:800
}

.restart{
  display:block;
  margin:20px auto 0;
  background:var(--primary2);
  color:#fff
}

@media(max-width:600px){

  .card{
    padding:17px;
    border-radius:16px
  }

  .question{
    font-size:19px
  }

  .option{
    font-size:16px
  }
}
</style>

</head>

<body>

<header>

<div class="wrap">

<h1>اختبار أسلوب الاستفهام</h1>

<p class="subtitle">
الصف السادس الإعدادي — أسئلة تفاعلية مستخلصة من الصفحات المرفقة

<div class="topbar">

</span>

</div>

</header>


<main class="wrap">

<div class="ad">

<div class="ad">

<div data-banner-id="2027674"></div>

</div>


<section class="card result" id="result">

<div class="score" id="score"></div>

<h2 id="resultTitle"></h2>

id="resultText"
class="small"
style="text-align:center">
</p>

<div class="review" id="review"></div>

<button
class="restart"

إعادة الاختبار

</button>

</section>

</main>


<script>

const questions = [

{
q:"ما إعراب «متى» في قول الشاعر: «متى صرتَ يا بحرَ غمدَ السيوفِ»؟",

opts:[
"اسم استفهام مبني على السكون في محل نصب مفعول فيه ظرف زمان",
"اسم استفهام مبني على السكون في محل رفع مبتدأ",
"اسم استفهام مبني على الفتح في محل نصب خبر مقدم",
"اسم استفهام مبني على السكون في محل جر بحرف الجر"
],

a:0,

rule:"أسماء الاستفهام: متى",

why:"«متى» تدل على الزمان، وتلاها فعل تام، لذلك تعرب ظرف زمان منصوبًا، وهي مبنية على السكون."
},


{
q:"ما إعراب «متى» في قول الشاعر: «روحي فداك متى أكونُ فداك»؟",

opts:[
"اسم استفهام مبني على السكون في محل رفع مبتدأ",
"اسم استفهام مبني على السكون في محل نصب مفعول فيه ظرف زمان",
"اسم استفهام مبني على السكون في محل رفع خبر مقدم للفعل الناقص «أكون»",
"اسم استفهام مبني على الفتح في محل نصب خبر مقدم"
],

a:2,

rule:"متى مع الفعل الناقص",

why:"تلا «متى» فعل ناقص لم يستوفِ خبره، فكانت «متى» في محل رفع خبر مقدم لـ«أكون»."
},


{
q:"في البيت: «أرى اليومَ موعدَنا لا الغدا»؛ ما اسم الاستفهام المناسب للاستفهام عن «اليوم»؟",

opts:[
"أين",
"كيف",
"متى",
"أيان"
],

a:2,

rule:"دلالة أسماء الاستفهام",

why:"«اليوم» يدل على الزمان، وأداة الاستفهام المناسبة للسؤال عن الزمان هي «متى»."
},


{
q:"ما إعراب اسم الاستفهام «مَن» في: «وتبيّن نفسها لك قلتُ ومَن لها»؟",

opts:[
"مبني على السكون في محل نصب مفعول به",
"مبني على السكون في محل رفع مبتدأ",
"مبني على السكون في محل جر بحرف الجر",
"مبني على الفتح في محل رفع خبر مقدم"
],

a:1,

rule:"من الاستفهامية",

why:"«من» للعاقل، وقد جاء بعدها شبه جملة «لها» خبرًا، فتعرب مبتدأ مبنيًا على السكون في محل رفع."
},


{
q:"أي صياغة تمثل الاستبدال الصحيح لـ«هل» بالهمزة في البيت الثالث: «أستشرُ خيرَ من ركب المطايا»؟",

opts:[
"هل أستشرُ خيرَ من ركب المطايا؟",
"أستشرُ خيرَ من ركب المطايا؟",
"أين أستشرُ خيرَ من ركب المطايا؟",
"كيف أستشرُ خيرَ من ركب المطايا؟"
],

a:1,

rule:"الهمزة وهل",

why:"الهمزة تحل محل «هل» في الاستفهام التصديقي، وتأتي في صدر الكلام."
},


{
q:"ما إعراب «مَن ذا» في: «واللهِ ما ندري إذا ما فاتَنا / ومن ذا الذي تُرضى سجاياهُ كلها»؟",

opts:[
"«من» اسم استفهام مبني على السكون في محل نصب مفعول به",
"«من» اسم استفهام مبني على السكون في محل رفع مبتدأ",
"«من» اسم استفهام مبني على السكون في محل جر بالإضافة",
"«من» اسم استفهام مبني على الفتح في محل نصب خبر"
],

a:1,

rule:"من الاستفهامية",

why:"«من» اسم استفهام مبني على السكون، ويكون موقعه الإعرابي وفق تركيب الجملة."
},


{
q:"ما إعراب «مَن» في: «فأصبر لعادتنا التي عوّدَتنا / أولًا فأرشدنا إلى مَن نذهب»؟",

opts:[
"مبني على السكون في محل رفع مبتدأ",
"مبني على السكون في محل جر بحرف الجر «إلى»",
"مبني على السكون في محل نصب مفعول به",
"مبني على الفتح في محل رفع خبر"
],

a:1,

rule:"من المسبوقة بحرف الجر",

why:"سبقت «من» بحرف الجر «إلى»، لذلك تعرب اسم استفهام مبنيًا على السكون في محل جر بحرف الجر."
},


{
q:"ما إعراب «كيف» في: «سائلِ الليلَ عنهم والنهارَ / كيف صارت نساؤهم والعذارى»؟",

opts:[
"اسم استفهام مبني على الفتح في محل نصب خبر مقدم",
"اسم استفهام مبني على السكون في محل رفع مبتدأ",
"اسم استفهام مبني على الفتح في محل جر بالإضافة",
"اسم استفهام مبني على السكون في محل نصب مفعول به"
],

a:0,

rule:"كيف مع الفعل الناقص",

why:"«كيف» اسم استفهام مبني على الفتح، وتلاها الفعل الناقص «صارت» الذي لم يستوفِ خبره، فهي خبر مقدم في محل نصب."
},


{
q:"في قولهم: «أتوني فقالوا: مِن ربيعةٍ أم مُضر»؛ ما نوع الاستفهام؟",

opts:[
"استفهام تصديقي بالهمزة المحذوفة",
"استفهام تصوري بالهمزة المحذوفة",
"استفهام حقيقي بـ«هل» المقدرة",
"استفهام مجازي خارج إلى النفي"
],

a:1,

rule:"الاستفهام التصوري",

why:"وجود «أم» المعادلة يدل على أن المستفهم عنه يُعيَّن بين أمرين؛ لذلك فهو استفهام تصوري، والهمزة مقدرة محذوفة."
},


{
q:"ما سبب تقدير همزة الاستفهام المحذوفة في: «مِن ربيعةٍ أم مُضر»؟",

opts:[
"لوجود حرف الجر «من»",
"لوجود «أم» المعادلة الدالة على التعيين",
"لأن «من» لا تستعمل للاستفهام",
"لأن الجملة منفية"
],

a:1,

rule:"حذف همزة الاستفهام",

why:"«أم» هنا معادلة، ووجودها قرينة على تقدير همزة استفهام محذوفة: «أمن ربيعة أم من مضر؟»."
},


{
q:"ما إعراب «مَن» الأولى في: «مَن أشتكي وإلى مَن أعتزي وندى مَن أجتذي»؟",

opts:[
"اسم استفهام مبني على السكون في محل جر بالإضافة",
"اسم استفهام مبني على السكون في محل رفع مبتدأ",
"اسم استفهام مبني على السكون في محل نصب مفعول به مقدم",
"اسم استفهام مبني على الفتح في محل نصب خبر"
],

a:2,

rule:"من مع الفعل المتعدي",

why:"تلاها الفعل «أشتكي» في التركيب المقصود، فجاءت «من» في محل نصب مفعول به مقدم."
},


{
q:"ما إعراب «مَن» الثانية في: «مَن أشتكي وإلى مَن أعتزي وندى مَن أجتذي»؟",

opts:[
"في محل جر بحرف الجر «إلى»",
"في محل رفع مبتدأ",
"في محل نصب مفعول به مقدم",
"في محل جر بالإضافة"
],

a:0,

rule:"من المسبوقة بحرف الجر",

why:"سبقت «من» بحرف الجر «إلى»، فكانت مبنية على السكون في محل جر بحرف الجر."
},


{
q:"ما إعراب «مَن» الثالثة في: «مَن أشتكي وإلى مَن أعتزي وندى مَن أجتذي»؟",

opts:[
"مبني على السكون في محل نصب مفعول به",
"مبني على السكون في محل جر بحرف الجر",
"مبني على السكون في محل جر بالإضافة",
"مبني على الفتح في محل رفع خبر"
],

a:2,

rule:"من المضافة",

why:"سبقت «من» باسم مضاف هو «ندى»، فتعرب اسم استفهام مبنيًا على السكون في محل جر بالإضافة."
},


{
q:"ما إعراب «كيف» في: «وكيف تلقى من تحت القبور»؟",

opts:[
"مبني على الفتح في محل نصب خبر مقدم",
"مبني على الفتح في محل رفع مبتدأ",
"مبني على السكون في محل نصب مفعول به",
"مبني على السكون في محل جر"
],

a:0,

rule:"كيف: خبر مقدم",

why:"«كيف» اسم استفهام مبني على الفتح، وتلاها تركيب يدل على الخبر، فجاءت في محل رفع خبر مقدم."
},


{
q:"في البيت الثاني من المقطع: «في حدقات العين أمرٌ في الفؤاد»؛ ما الحرف المحذوف المقدّر؟",

opts:[
"همزة الاستفهام",
"حرف العطف الواو",
"حرف الجر «من»",
"أداة النفي «لا»"
],

a:0,

rule:"حذف همزة الاستفهام",

why:"التقدير «أفي حدقات العين أمرٌ في الفؤاد؟»، وحذفت همزة الاستفهام للتخفيف."
},


{
q:"ما إعراب «مَن ذا» في: «مَن ذا يغيرُ على الأسودِ بغابها»؟",

opts:[
"«من» اسم استفهام مبني على السكون في محل رفع مبتدأ",
"«من» اسم استفهام مبني على السكون في محل نصب مفعول به",
"«من» اسم استفهام مبني على الفتح في محل رفع خبر",
"«من» اسم استفهام مبني على السكون في محل جر بالإضافة"
],

a:0,

rule:"من ذا مع الفعل اللازم",

why:"تلا «من» الفعل اللازم «يغير»، فتعرب «من» اسم استفهام مبنيًا على السكون في محل رفع مبتدأ."
},


{
q:"ما إعراب «مَن ذا» في: «أو مَن ذا يعومُ بسببِ التمساح»؟",

opts:[
"مبني على السكون في محل جر بالإضافة",
"مبني على السكون في محل نصب مفعول به",
"مبني على السكون في محل رفع مبتدأ",
"مبني على الفتح في محل رفع خبر"
],

a:2,

rule:"من ذا مع الفعل اللازم",

why:"تلا «من» الفعل اللازم «يعوم»، فكانت «من» مبتدأ مرفوعًا، وهي مبنية على السكون."
},


{
q:"ما إعراب «ماذا» في: «أبا الهولِ ماذا وراءَ البقاءِ»؟",

opts:[
"اسم استفهام مبني على السكون في محل نصب مفعول به",
"اسم استفهام مبني على السكون في محل رفع مبتدأ",
"اسم استفهام مبني على الفتح في محل نصب ظرف زمان",
"اسم استفهام مبني على السكون في محل جر بالإضافة"
],

a:1,

rule:"ماذا مع شبه الجملة",

why:"تلا «ماذا» شبه جملة «وراء البقاء»، فجاءت «ماذا» في محل رفع مبتدأ."
},


{
q:"ما إعراب «أيّ» في: «فيا ليت شعري أيَّ وقتٍ تحاولُ»؟",

opts:[
"اسم استفهام مبني على السكون في محل نصب مفعول به",
"اسم استفهام معرب منصوب في محل ظرف زمان",
"اسم استفهام مبني على الفتح في محل رفع خبر مقدم",
"اسم استفهام معرب مجرور بحرف الجر"
],

a:1,

rule:"أيّ الاستفهامية",

why:"«أيّ» اسم استفهام معرب ملازم للإضافة، ولما أضيفت إلى «وقت» الدال على الزمان جاءت بمعنى «متى» وأعربت ظرف زمان منصوبًا."
}

];


let order=[];
let current=0;
let answers=Array(questions.length).fill(null);


function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


function render(){

  const quiz=document.getElementById("quiz");

  const q=questions[order[current]];

  document.getElementById("count").textContent=
    `السؤال ${current+1} من ${questions.length}`;

  document.getElementById("bar").style.width=
    `${((current+1)/questions.length)*100}%`;


  const shuffled=shuffle(
    q.opts.map(
      (text,i)=>({
        text,
        i
      })
    )
  );


  quiz.innerHTML=`

  <div class="card">

    <div class="qno">
      السؤال ${current+1}
    </div>

    <div class="question">
      ${q.q}
    </div>

    <div class="options">

      ${shuffled.map((o,k)=>`

        <label class="option
          ${answers[current]?.selected===o.i?'selected':''}">

          <input
            type="radio"
            name="opt"
            value="${o.i}"
            ${answers[current]?.selected===o.i?'checked':''}
          >

          <strong>
            ${String.fromCharCode(1571+k)})
          </strong>

          ${o.text}

        </label>

      `).join("")}

    </div>


    <div class="actions">

      <button
        class="prev"
        onclick="prev()"
        ${current===0?'disabled':''}>

        السابق

      </button>


      <button
        class="next"
        id="next"
        onclick="next()"
        ${answers[current]?'':'disabled'}>

        ${current===questions.length-1
          ?"إنهاء الاختبار"
          :"التالي"}

      </button>

    </div>

  </div>

  `;


  document.querySelectorAll(".option")
  .forEach(el=>{

    el.addEventListener("click",()=>{

      document
        .querySelectorAll(".option")
        .forEach(x=>
          x.classList.remove("selected")
        );

      el.classList.add("selected");


      const val=
        Number(
          el.querySelector("input").value
        );


      answers[current]={
        selected:val
      };


      document.getElementById("next")
        .disabled=false;

    });

  });

}


function next(){

  if(!answers[current])
    return;


  if(current<questions.length-1){

    current++;

    render();

  }else{

    finish();

  }

}


function prev(){

  if(current>0){

    current--;

    render();

  }

}


function finish(){

  let score=0;


  answers.forEach((x,i)=>{

    if(
      x &&
      x.selected===questions[order[i]].a
    ){

      score++;

    }

  });


  document.getElementById("quiz")
    .style.display="none";


  document
    .querySelectorAll(".ad")
    .forEach(x=>
      x.style.display="none"
    );


  const r=
    document.getElementById("result");

  r.style.display="block";


  document.getElementById("score")
    .textContent=
      `${score} / ${questions.length}`;


  const pct=
    Math.round(
      score/questions.length*100
    );


  document.getElementById("resultTitle")
    .textContent=
      pct>=90
      ?"ممتاز جدًا!"
      :pct>=75
      ?"أداء جيد جدًا"
      :"واصل التدريب والمراجعة";


  document.getElementById("resultText")
    .textContent=
      `درجتك: ${pct}% — يمكنك مراجعة تفسير كل سؤال أدناه.`;


  document.getElementById("review")
    .innerHTML=

    questions.map((q,i)=>{

      const x=answers[i];

      const ok=
        x &&
        x.selected===q.a;


      return `

      <div class="reviewItem">

        <div>
          <strong>
            ${i+1}. ${q.q}
          </strong>
        </div>

        <div class="${ok?'oktxt':'badtxt'}">

          ${ok
            ?"✓ إجابتك صحيحة"
            :"✗ إجابتك غير صحيحة"}

        </div>

        <div>

          الإجابة الصحيحة:

          <strong>
            ${q.opts[q.a]}
          </strong>

        </div>

        <div class="small">

          <strong>القاعدة:</strong>
          ${q.rule}

          <br>

          <strong>التفسير:</strong>
          ${q.why}

        </div>

      </div>

      `;

    }).join("");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function restart(){

  order=
    shuffle(
      [...Array(questions.length).keys()]
    );

  current=0;

  answers=
    Array(questions.length).fill(null);


  document.getElementById("result")
    .style.display="none";


  document.getElementById("quiz")
    .style.display="block";


  document
    .querySelectorAll(".ad")
    .forEach(x=>
      x.style.display="flex"
    );


  render();

}


order=
  shuffle(
    [...Array(questions.length).keys()]
  );

render();

</script>

</body>
</html>
