<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الذاكرة المظلمة</title>
    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-glow: #ffae00;
            --bg-color: #080703;
            --card-bg: #14120b;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--gold-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            gap: 12px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15), inset 0 0 15px rgba(0,0,0,0.8);
            max-width: 90vw;
        }

        .cell {
            background: #241f10;
            border: 2px solid #554518;
            border-radius: 8px;
            cursor: pointer;
