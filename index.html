const letters = ["أ","ب","ج","د"];
const ordinals = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر"];
let current = 0;
const answers = new Array(questions.length).fill(null);

const el = id => document.getElementById(id);
function render() {
  const q = questions[current];
  el("question").innerHTML = q.q;
  el("questionNo").textContent = "السؤال " + ordinals[current];
  el("counter").textContent = `السؤال ${current+1} من ${questions.length}`;
  const progress = Math.round((current / questions.length) * 100);
  el("pct").textContent = progress + "%";
  el("bar").style.width = progress + "%";
  el("options").innerHTML = "";
  q.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option" + (answers[current] === i ? " selected" : "");
    b.innerHTML = `<span class="letter">${letters[i]}</span><span>${text}</span>`;
    b.addEventListener("click", () => {
      answers[current] = i;
      render();
    });
    el("options").appendChild(b);
  });
  el("prev").disabled = current === 0;
  el("next").disabled = answers[current] === null;
  el("next").textContent = current === questions.length - 1 ? "إنهاء الاختبار" : "التالي";
}
function finish() {
  let correct = 0;
  questions.forEach((q, i) => { if (answers[i] === q.answer) correct++; });
  const total = questions.length;
  const wrong = total - correct;
  const score = Math.round(correct / total * 100);
  el("score").textContent = score + "%";
  el("correct").textContent = correct;
  el("wrong").textContent = wrong;
  let title, message, icon;
  if (score >= 90) {
    title = "ممتاز جدًا!"; icon = "🏆";
    message = "نتيجة رائعة! لديك إتقان قوي لقواعد الاستفهام. استمر بهذا المستوى وواصل مراجعة التفاصيل الدقيقة.";
  } else if (score >= 75) {
    title = "أحسنت!"; icon = "🌟";
    message = "أداء قوي جدًا. راجع الأسئلة التي أخطأت فيها، وستقترب من الإتقان الكامل.";
  } else if (score >= 50) {
    title = "بداية جيدة، واصل التقدم!"; icon = "💪";
    message = "لديك أساس جيد. ركّز على القواعد المبيّنة في المراجعة، ثم أعد الاختبار لترى تطورك.";
  } else {
    title = "لا تستسلم!"; icon = "📚";
    message = "الخطأ جزء طبيعي من التعلم. راجع التفسيرات بهدوء ثم أعد الاختبار، وستلاحظ تحسنًا بإذن الله.";
  }
  el("resultTitle").textContent = title;
  el("resultIcon").textContent = icon;
  el("message").textContent = message;
  const review = el("review");
  review.innerHTML = "<h3>مراجعة الإجابات والتعليل</h3>";
  questions.forEach((q, i) => {
    const ok = answers[i] === q.answer;
    const details = document.createElement("details");
    const userText = answers[i] === null ? "لم تُجب" : letters[answers[i]] + " — " + q.options[answers[i]];
    const wrongBlock = ok ? "" : `<p class="wrong-answer"><b>إجابتك:</b> ${userText}</p>`;
    details.innerHTML = `
      <summary class="${ok ? "answer" : "wrong-answer"}">${i+1}. ${ok ? "✓ إجابة صحيحة" : "✗ إجابة غير صحيحة"}</summary>
      <div class="review-content">
        ${wrongBlock}
        <p class="answer"><b>الإجابة الصحيحة:</b> ${letters[q.answer]} — ${q.correctText}</p>
        <div class="rule"><b>القاعدة المختبرة:</b><br>${q.rule}</div>
        <p><b>لماذا؟</b><br>${q.why}</p>
        <p><b>لماذا المشتتات خاطئة؟</b></p>
        <ul>${q.distractors.map(x => "<li>"+x+"</li>").join("")}</ul>
      </div>`;
    review.appendChild(details);
  });
  el("quiz").classList.add("hidden");
  el("result").classList.remove("hidden");
  window.scrollTo({top:0, behavior:"smooth"});
}
el("next").addEventListener("click", () => {
  if (answers[current] === null) return;
  if (current < questions.length - 1) { current++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
});
el("prev").addEventListener("click", () => {
  if (current > 0) { current--; render(); window.scrollTo({top:0,behavior:"smooth"}); }
});
el("restart").addEventListener("click", () => {
  current = 0; answers.fill(null);
  el("result").classList.add("hidden"); el("quiz").classList.remove("hidden");
  render(); window.scrollTo({top:0,behavior:"smooth"});
});
render();
</script>
