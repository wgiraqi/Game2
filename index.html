<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>الفية(1) — اختبار تفاعلي</title>
<style>
:root{--bg:#080b16;--panel:#11172a;--panel2:#171e35;--text:#f5f7ff;--muted:#aab3ca;--accent:#7c5cff;--accent2:#21d4fd;--ok:#25c98a;--bad:#ff5c7a;--border:rgba(255,255,255,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#18234b 0,transparent 34%),radial-gradient(circle at 90% 10%,#25204a 0,transparent 30%),var(--bg);color:var(--text)}
button{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.hero{padding:34px 0 18px;text-align:center}.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.05);color:#cfd5e8;font-size:13px}.hero h1{font-size:clamp(30px,6vw,52px);margin:16px 0 8px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:16px}.ad{min-height:70px;margin:16px 0 22px;padding:10px;border:1px dashed rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.025);display:flex;justify-content:center;align-items:center;overflow:hidden}
.card{background:linear-gradient(145deg,rgba(22,29,53,.96),rgba(13,18,34,.96));border:1px solid var(--border);border-radius:26px;box-shadow:0 20px 70px rgba(0,0,0,.3);overflow:hidden}.topbar{padding:18px 20px;border-bottom:1px solid var(--border)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}.progress{height:8px;background:#252c43;border-radius:99px;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .35s ease}.content{padding:24px}.question{font-size:clamp(21px,4vw,29px);line-height:1.8;margin:0 0 22px}.options{display:grid;gap:12px}.option{width:100%;text-align:right;padding:16px 17px;border:1px solid var(--border);border-radius:17px;background:rgba(255,255,255,.035);color:var(--text);cursor:pointer;transition:.18s;display:flex;align-items:flex-start;gap:12px}.option:hover{transform:translateY(-1px);border-color:rgba(124,92,255,.65);background:rgba(124,92,255,.09)}.option.selected{border-color:var(--accent);background:rgba(124,92,255,.14);box-shadow:0 0 0 2px rgba(124,92,255,.12)}.letter{width:32px;height:32px;min-width:32px;border-radius:10px;display:grid;place-items:center;background:#252c43;color:#dce1f2;font-weight:700}.selected .letter{background:var(--accent);color:#fff}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:0;border-radius:14px;padding:13px 19px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,var(--accent),#5a8cff);color:#fff}.secondary{background:#232a40;color:#dfe4f4}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center;padding:34px 24px}.score{font-size:62px;font-weight:900;margin:8px 0;background:linear-gradient(135deg,#fff,#9fdfff);-webkit-background-clip:text;background-clip:text;color:transparent}.message{font-size:20px;line-height:1.8;color:#e9ecf8;margin:8px auto 22px;max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.035)}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}.review{margin-top:24px;text-align:right}.review details{border:1px solid var(--border);border-radius:15px;margin:9px 0;background:rgba(255,255,255,.025);padding:12px 15px}.review summary{cursor:pointer;font-weight:700}.wrong{color:#ff9db0}.right{color:#76e7bb}.footer{text-align:center;color:#77819a;font-size:12px;padding:25px 0 40px}
@media(max-width:620px){.content{padding:18px}.stats{grid-template-columns:1fr}.actions{position:sticky;bottom:10px;background:rgba(8,11,22,.9);padding:8px;border-radius:15px}.btn{flex:1}.hero{padding-top:24px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <span class="badge">اختبار تفاعلي • النحو والاستفهام</span>
  <h1>الفية(1)</h1>
  <p>اختبر فهمك لإعراب أسماء الاستفهام وخصائص أدوات الاستفهام.</p>
</header>

<div class="ad" aria-label="مساحة إعلانية">
  <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="461917"></script>
  <div data-banner-id="2027698"></div>
</div>

<section class="card" id="quizCard">
  <div class="topbar">
    <div class="meta"><span id="counter">السؤال 1 من 18</span><span id="percent">0%</span></div>
    <div class="progress"><span id="progress"></span></div>
  </div>
  <div class="content">
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <div class="actions">
      <button class="btn secondary" id="prev" type="button">السابق</button>
      <button class="btn primary" id="next" type="button" disabled>التالي</button>
    </div>
  </div>
</section>

<section class="card result hidden" id="resultCard">
  <div class="badge">اكتمل الاختبار ✓</div>
  <div class="score" id="score">0%</div>
  <h2 id="resultTitle">أحسنت!</h2>
  <p class="message" id="message"></p>
  <div class="stats">
    <div class="stat"><b id="correct">0</b><span>إجابات صحيحة</span></div>
    <div class="stat"><b id="wrong">0</b><span>إجابات خاطئة</span></div>
    <div class="stat"><b id="total">18</b><span>إجمالي الأسئلة</span></div>
  </div>
  <button class="btn primary" id="restart" type="button">إعادة الاختبار</button>
  <div class="review" id="review"></div>
</section>

<div class="ad" aria-label="مساحة إعلانية">
  <div data-banner-id="2027698"></div>
</div>

<footer class="footer">الفية(1) — اختبار تفاعلي تعليمي</footer>
</div>

<script>
const questions = [
{q:`في قول الشاعر: «مَنْ أشتكي؟ وإلى مَنْ أعتزي؟ وندى مَنْ أجتدي؟»<br>ما الإعراب الصحيح لاسم الاستفهام (مَنْ) الأول (مَنْ أشتكي)؟`,o:[
`اسم استفهام مبني في محل رفع مبتدأ؛ تلاه فعل متعدٍ.`,
`اسم استفهام مبني في محل رفع خبر مقدم؛ تلاه فعل متعدٍ.`,
`اسم استفهام مبني في محل نصب مفعول به مقدم وجوباً؛ تلاه فعل متعدٍ لم يستوفِ مفعوله.`,
`اسم استفهام مبني في محل نصب حال؛ تلاه جملة فعلية تامة.`],a:2},
{q:`في قول الشاعر: «مَنْ أشتكي؟ وإلى مَنْ أعتزي؟ وندى مَنْ أجتدي؟»<br>ما الموقع الإعرابي لاسم الاستفهام (مَنْ) الثاني (إلى مَنْ أعتزي)؟`,o:[
`في محل جر بالإضافة؛ لأنها وقعت بعد حرف جر.`,
`في محل نصب مفعول به للفعل (أعتزي)؛ لأنه متعدٍ.`,
`في محل رفع مبتدأ؛ لأن الفعل بعدها استوفى معناه.`,
`في محل جر بحرف الجر؛ لأنها سُبقت بحرف الجر (إلى).`],a:3},
{q:`في قول الشاعر: «مَنْ أشتكي؟ وإلى مَنْ أعتزي؟ وندى مَنْ أجتدي؟»<br>ما الموقع الإعرابي لاسم الاستفهام (مَنْ) الثالث (وندى مَنْ أجتدي)؟`,o:[
`في محل نصب مفعول به مقدم للفعل (أجتدي).`,
`في محل جر بالإضافة؛ لأنها سُبقت باسم نكرة مضاف.`,
`في محل جر بحرف الجر؛ لأن (ندى) تعمل عمل حروف الجر.`,
`في محل رفع مبتدأ؛ لأنها سُبقت باسم معرفة.`],a:1},
{q:`في قول الشاعر: «وكَيْفَ لِقَاءُ مَنْ تَحْتَ القُبُورِ»<br>ما إعراب اسم الاستفهام (كيف) معللاً؟`,o:[
`في محل رفع مبتدأ؛ تلاها اسم معرفة.`,
`في محل نصب حال؛ تلاها اسم نكرة.`,
`في محل رفع خبر مقدم وجوباً؛ تلاها اسم معرفة.`,
`في محل نصب مفعول مطلق؛ لأنها تدل على هيئة الحدث.`],a:2},
{q:`في قول الشاعر: «في حَدَقَاتِ العينِ أم في الفُؤادِ تسكُنُ»<br>ثمة حرف محذوف، ما هو؟ وما تقديره؟ ولماذا حُذف؟`,o:[
`هل الاستفهامية، والتقدير: (هل في حدقات)، وحذفت للتخفيف.`,
`همزة الاستفهام، والتقدير: (أم في الفؤاد أتسكن)، وحذفت لوجود النفي.`,
`همزة النداء، والتقدير: (أفي حدقات)، وحذفت للتعظيم.`,
`همزة الاستفهام، والتقدير: (أفي حدقات)، وحذفت للتخفيف.`],a:3},
{q:`في قول الشاعر: «مَنْ ذا يُغيّرُ على الأُسودِ بِغَابِها»<br>ما إعراب اسم الاستفهام (مَنْ ذا) معللاً؟`,o:[
`مبتدأ؛ تلاه فعل متعدٍ استوفى مفعوله.`,
`مبتدأ؛ تلاه فعل لازم.`,
`مفعول به مقدم وجوباً؛ تلاه فعل متعدٍ لم يستوفِ مفعوله.`,
`خبر مقدم؛ تلاه اسم معرفة.`],a:1},
{q:`في عجز البيت: «أو مَنْ ذا يَعومُ بِمَسْبَحِ التِّمساحِ»<br>ما إعراب (مَنْ ذا) معللاً؟`,o:[
`حال؛ لأن الجملة الفعلية تدل على هيئة الفاعل.`,
`مفعول به؛ لأن الفعل يحتاج إلى مفعول به ليكتمل معناه.`,
`مبتدأ؛ تلاه فعل لازم.`,
`مبتدأ؛ تلاه فعل ناقص استوفى خبره.`],a:2},
{q:`في قول الشاعر: «أبا الهولِ ماذا وراءَ البقاءِ»<br>ما الإعراب الصحيح لاسم الاستفهام (ماذا)؟`,o:[
`مفعول فيه ظرف مكان؛ لأن (وراء) تدل على المكان.`,
`مفعول به مقدم؛ تلاه شبه جملة ظرفية.`,
`خبر مقدم؛ تلاه اسم معرفة مضاف.`,
`مبتدأ؛ تلاه شبه جملة ظرفية.`],a:3},
{q:`في قول الشاعر: «فَيا ليتَ شِعري أيَّ وقْتٍ تُحاوِلُ»<br>ما إعراب اسم الاستفهام (أيّ) معللاً؟`,o:[
`مبتدأ؛ تلاه فعل تام.`,
`مفعول به مقدم؛ تلاه فعل متعدٍ لم يستوفِ مفعوله.`,
`مفعول فيه ظرف زمان منصوب؛ تلاه فعل تام.`,
`مفعول مطلق منصوب؛ لأنها دالة على الحدث.`],a:2},
{q:`في قول الشاعر: «متى صِرتَ يابحرُ غُمدَ السيوفِ» و«متى أكونُ فداك»<br>ما الموقع الإعرابي لـ(متى) في البيتين؟`,o:[
`في محل رفع مبتدأ؛ تلاها فعل ناقص استوفى خبره.`,
`في محل نصب مفعول فيه ظرف زمان؛ تلاها فعل ناقص استوفى خبره.`,
`في محل نصب خبر مقدم للفعل الناقص؛ تلاها فعل ناقص لم يستوفِ خبره.`,
`في محل نصب حال؛ تلاها فعل ناقص استوفى خبره.`],a:1},
{q:`في جملة: «أرى اليــــــومَ موعــــدنا لا الغدا»<br>إذا أردت الاستفهام عن العبارة المخطوطة (اليوم موعدنا) باسم استفهام مناسب، فما الصياغة الصحيحة؟`,o:[
`أيان موعدنا؟`,`أين موعدنا؟`,`متى موعدنا؟`,`هل موعدنا اليوم؟`],a:2},
{q:`في قول الشاعر: «قلتُ ومَنْ لها»<br>ما إعراب اسم الاستفهام (مَنْ) معللاً؟`,o:[
`مفعول به مقدم؛ تلاه شبه جملة.`,
`مجرور بحرف الجر؛ سُبق بحرف العطف الواو.`,
`خبر مقدم؛ تلاه شبه جملة.`,
`مبتدأ؛ تلاه شبه جملة جار ومجرور.`],a:3},
{q:`في قول الشاعر: «قالوا يسُرُّكَ أن تزوركَ في الكرى»<br>ما خصيصة الهمزة في هذا البيت؟`,o:[
`دخلت على الاستفهام التصوري، والتقدير: (أيسرك أم لا).`,
`حُذفت للتخفيف، والتقدير: (أيسُرُّكَ).`,
`دخلت على الجملة المنفية، والتقدير: (ألم يسرك).`,
`لها الصدارة في الكلام، والتقدير: (فأيسرك).`],a:1},
{q:`في قول الشاعر: «ألستم خَيرَ مَنْ ركبَ المطايا»<br>كيف تجعل استبدال (هل) بالهمزة ممكناً مع الحفاظ على المعنى قدر الإمكان؟`,o:[
`هل لستم خيرَ مَنْ ركبَ المطايا؟`,`أوهل أنتم خيرُ مَنْ ركبَ المطايا؟`,`هل أنتم خيرُ مَنْ ركبَ المطايا؟`,`هل ليسوا خيرَ مَنْ ركبَ المطايا؟`],a:2},
{q:`في قول الشاعر: «إليــــــكَ من الـــذي نتطــلبُ» و«ومَنْ ذا الذي تـُـــــرضى سجاياه»<br>ما الوجه الإعرابي لأسماء الاستفهام (مَنْ - مَنْ ذا) في البيتين؟`,o:[
`مبتدأ فقط؛ لأنها تلاها اسم موصول.`,
`مفعول به مقدم؛ لأنها تلاها فعل متعدٍ (نتطلب / تُرضى).`,
`مبتدأ أو خبر مقدم؛ لأنها تلاها اسم معرفة.`,
`خبر مقدم وجوباً؛ لأنها تلاها اسم نكرة.`],a:2},
{q:`في قول الشاعر: «أولا فـارشــــدنا إلى مَنْ نَــــــذهـبُ»<br>ما إعراب اسم الاستفهام (مَنْ)؟`,o:[
`في محل جر بالإضافة.`,`في محل نصب مفعول به للفعل (نذهب).`,`في محل جر بحرف الجر.`,`في محل رفع مبتدأ؛ تلاه فعل لازم.`],a:2},
{q:`في قول الشاعر: «كيــــف صـــــارت نـسـاؤُهم والعـذارى»<br>ما الإعراب الصحيح لـ(كيف) معللاً؟`,o:[
`في محل نصب خبر مقدم للفعل الناقص؛ لأنه لم يستوفِ خبره.`,
`في محل رفع خبر مقدم؛ تلاه اسم معرفة.`,
`مفعول به للفعل الناقص؛ لأنه لم يستوفِ مفعوله.`,
`في محل نصب حال؛ تلاه فعل ناقص استوفى خبره.`],a:0},
{q:`في قول الشاعر: «فقالوا: من ربيعة أم مُضَر»<br>ما نوع الاستفهام في هذا البيت؟ ولماذا؟`,o:[
`تصديقي؛ لأن الجملة مثبتة، و(أم) هنا منقطعة وليست معادلة.`,
`تصوري؛ لوجود (أم) المعادلة، ويُجاب عنه بالتعيين.`,
`تصديقي؛ لأن الهمزة محذوفة، ويُجاب عنه بحرف الجواب.`,
`تصوري؛ لأن الأداة المحذوفة هي (هل) و(هل) تفيد التصور مع (أم).`],a:1}
];

let current=0;
const answers=Array(questions.length).fill(null);
const qEl=document.getElementById('question'), oEl=document.getElementById('options');
const counter=document.getElementById('counter'), percent=document.getElementById('percent'), progress=document.getElementById('progress');
const prev=document.getElementById('prev'), next=document.getElementById('next');
const quizCard=document.getElementById('quizCard'), resultCard=document.getElementById('resultCard');

function render(){
  const q=questions[current];
  qEl.innerHTML=q.q;
  oEl.innerHTML='';
  q.o.forEach((text,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='option'+(answers[current]===i?' selected':'');
    b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+text+'</span>';
    b.onclick=()=>{answers[current]=i;render();};
    oEl.appendChild(b);
  });
  const done=current+1, pct=Math.round((current/questions.length)*100);
  counter.textContent=`السؤال ${done} من ${questions.length}`;
  percent.textContent=`${pct}%`;
  progress.style.width=`${(current/questions.length)*100}%`;
  prev.disabled=current===0;
  next.disabled=answers[current]===null;
  next.textContent=current===questions.length-1?'إنهاء الاختبار':'التالي';
}
next.onclick=()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render()}else finish()};
prev.onclick=()=>{if(current>0){current--;render()}};
document.getElementById('restart').onclick=()=>{current=0;answers.fill(null);resultCard.classList.add('hidden');quizCard.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});render()};

function finish(){
  let correct=0; answers.forEach((x,i)=>{if(x===questions[i].a)correct++});
  const total=questions.length, wrong=total-correct, pct=Math.round(correct/total*100);
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('total').textContent=total;
  let title,msg;
  if(pct>=90){title='ممتاز جدًا! 🏆';msg='إتقان رائع. واضح أنك تملك فهمًا قويًا لقواعد الاستفهام. واصل بهذا المستوى!'}
  else if(pct>=75){title='أحسنت! 🌟';msg='نتيجة قوية. راجع الأخطاء القليلة، وستقترب من الإتقان الكامل.'}
  else if(pct>=50){title='جيد، واصل التقدم 💪';msg='لديك أساس جيد. مراجعة القواعد التي أخطأت فيها ستصنع فرقًا كبيرًا.'}
  else {title='لا تستسلم! 📚';msg='الخطأ جزء من التعلم. أعد الاختبار بعد مراجعة القواعد وستلاحظ تحسنًا واضحًا.'}
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('message').textContent=msg;
  const review=document.getElementById('review'); review.innerHTML='<h3>مراجعة الإجابات</h3>';
  questions.forEach((q,i)=>{
    const d=document.createElement('details');
    const ok=answers[i]===q.a;
    const user=answers[i]===null?'لم تُجب':String.fromCharCode(65+answers[i]);
    d.innerHTML=`<summary class="${ok?'right':'wrong'}">${i+1}. ${ok?'إجابة صحيحة':'إجابة غير صحيحة'}</summary><p>إجابتك: <b>${user}</b></p><p>الإجابة الصحيحة: <b>${String.fromCharCode(65+q.a)}</b></p>`;
    review.appendChild(d);
  });
  quizCard.classList.add('hidden');resultCard.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
